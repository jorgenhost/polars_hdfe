[tool.uv]
# Rebuild package when any rust files change
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "**/*.rs"}]
# Uncomment to build rust code in development mode
# config-settings = { build-args = '--profile=dev' }

[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.3.0"]
build-backend = "maturin"

[project]
name = "polars-hdfe"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "polars>=1.8.2"
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "maturin>=1.11.5",
    "patchelf>=0.17.2.4 ; sys_platform == 'linux'",
    "patsy>=1.0.2",
    "polars-ds>=0.5.3",
    "polars-ols>=0.3.5",
    "pyarrow>=17.0.0",
    "pyfixest>=0.15.1",
]


[tool.maturin]
module-name = "polars_hdfe._internal"

[[tool.mypy.overrides]]
module = "polars.utils.udfs"
ignore_missing_imports = true
